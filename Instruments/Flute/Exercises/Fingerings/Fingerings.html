<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="fingerings.css">
        <title>Revue</title>
    </head>
    <body>
        <div id="page-text-container">
            <div id="page-title">
                <h1>Revue des doigtées</h1>
            </div>
            <div id="page-description">
                <h2>Révision des doigtés musicaux</h2>
            </div>
        </div>
        
        <div id="home-button">
            <a href="../../../../index.html">
                <img src="../../../../Images/home.png" draggable="false" height="40">
            </a>
        </div>


        <div id="main-container">
            <div id="instrument-container" class="fade-in">
                <div id="note-text-container">
                    <p id="note-text">
                        Quel doigté voulez-vous réviser?
                    </p>
                </div>

                <div id="instrument-image">
                    <img src="../../Images/flute-fingerings.png" draggable="false" width="640px">
                </div>
                <div id="keys">
                    <img id="thumb-1-image" class="key-image" src="../../Images/Flute Keys/thumb-1.png" draggable="false">
                    <img id="thumb-A-sharp-image" class="key-image" src="../../Images/Flute Keys/thumb-A-sharp.png" draggable="false">
                    <img id="key-1-image" class="key-image" src="../../Images/Flute Keys/key-1.png" draggable="false">
                    <img id="key-2-image" class="key-image" src="../../Images/Flute Keys/key-2.png" draggable="false">
                    <img id="key-3-image" class="key-image" src="../../Images/Flute Keys/key-3.png" draggable="false">
                    <img id="key-4-image" class="key-image" src="../../Images/Flute Keys/key-4.png" draggable="false">
                    <img id="key-5-image" class="key-image" src="../../Images/Flute Keys/key-5.png" draggable="false">
                    <img id="key-6-image" class="key-image" src="../../Images/Flute Keys/key-6.png" draggable="false">
                    <img id="G-sharp-key-image" class="key-image" src="../../Images/Flute Keys/G-sharp-key.png" draggable="false">
                    <img id="A-sharp-trill-key-image" class="key-image" src="../../Images/Flute Keys/A-sharp-trill-key.png" draggable="false">
                    <img id="trill-1-image" class="key-image" src="../../Images/Flute Keys/trill-1.png" draggable="false">
                    <img id="trill-2-image" class="key-image" src="../../Images/Flute Keys/trill-2.png" draggable="false">
                    <img id="D-sharp-key-image" class="key-image" src="../../Images/Flute Keys/D-sharp-key.png" draggable="false">
                    <img id="C-sharp-key-image" class="key-image" src="../../Images/Flute Keys/C-sharp-key.png" draggable="false">
                    <img id="C-key-image" class="key-image" src="../../Images/Flute Keys/C-key.png" draggable="false">
                </div>

                <div id="note-choice-container">
                    <select id="note-choice">
                    </select>
                </div>
                <div id="apply-button-container">
                    <button id="apply-button" onclick="manageInput()">Vérifier</button>
                </div>
            </div>
        </div>



        <script src="fingerings.js"></script>
    </body>
</html>
